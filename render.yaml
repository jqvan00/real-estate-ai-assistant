services:
  - type: web
    name: real-estate-ai-assistant-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: ENVIRONMENT
        value: testing
      - key: DATABASE_URL
        fromDatabase:
          name: real-estate-ai-assistant-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CENSUS_API_KEY
        sync: false
      - key: RENTCAST_API_KEY
        sync: false
      - key: ZILLAPI_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false

databases:
  - name: real-estate-ai-assistant-db
    plan: free
    databaseName: real_estate_ai_assistant
    user: real_estate_ai_assistant
